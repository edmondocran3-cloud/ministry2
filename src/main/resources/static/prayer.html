<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prayer Requests</title><style>body{font-family:sans-serif;background:#0f172a;color:white;text-align:center;margin:0}nav{background:#1e293b;padding:12px}nav a{color:#facc15;text-decoration:none;margin:0 7px;font-weight:bold;font-size:14px}.box{background:#1e293b;padding:25px;border-radius:15px;max-width:500px;margin:20px auto}input,textarea{width:100%;padding:12px;border-radius:10px;border:none;margin-top:8px;box-sizing:border-box}button{width:100%;background:#facc15;padding:14px;border:none;border-radius:25px;font-weight:bold;margin-top:10px}h1{color:#facc15}</style></head><body>
<nav><a href="index.html">Home</a><a href="about.html">About</a><a href="sermons.html">Sermons</a><a href="events.html">Events</a><a href="prayer.html">Prayer</a><a href="contact.html">Contact</a></nav>
<h1>🙏 Prayer Requests</h1><div class="box"><p>We will stand with you in prayer.</p><input id="name" placeholder="Your Name"><textarea id="req" placeholder="Your Prayer Request..." rows="4"></textarea><button onclick="save()">Send Prayer Request</button><p id="msg"></p></div>
<script>function save(){let n=document.getElementById('name').value;let r=document.getElementById('req').value;if(!n||!r){document.getElementById('msg').innerText='Please fill both fields';return;}let all=JSON.parse(localStorage.getItem('prayers')||'[]');all.push({name:n,req:r,date:new Date().toLocaleString()});localStorage.setItem('prayers',JSON.stringify(all));document.getElementById('msg').innerText='✅ Received! We are praying for you, '+n;document.getElementById('name').value='';document.getElementById('req').value='';}</script></body></html>

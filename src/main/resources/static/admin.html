<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin - Prayer Storage</title><style>body{font-family:sans-serif;background:#0f172a;color:white;text-align:center;margin:0}nav{background:#1e293b;padding:12px}nav a{color:#facc15;text-decoration:none;margin:0 7px;font-weight:bold;font-size:14px}.box{background:#1e293b;padding:20px;border-radius:15px;max-width:500px;margin:15px auto;text-align:left}h1{color:#facc15}button{background:red;color:white;padding:10px 20px;border:none;border-radius:10px}</style></head><body>
<nav><a href="index.html">Home</a><a href="admin.html">Admin</a></nav>
<h1>🔐 Admin - Prayer Storage</h1><p>All prayer requests saved on this phone:</p><div id="list"></div><button onclick="clearAll()">Clear All</button>
<script>let all=JSON.parse(localStorage.getItem('prayers')||'[]');let h=document.getElementById('list');if(all.length==0)h.innerHTML='<div class="box">No prayers yet.</div>';else all.forEach(p=>{h.innerHTML+='<div class="box"><b>'+p.name+'</b><br>'+p.req+'<br><small>'+p.date+'</small></div>'});function clearAll(){localStorage.removeItem('prayers');location.reload();}</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Prophet Edmond Ocran</title>
<style>body{font-family:Arial;padding:20px;background:#f4f4f4} .box{background:#fff;padding:20px;border-radius:10px;max-width:500px;margin:auto} input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:6px} button{background:#8B0000;color:#fff;padding:12px;border:none;border-radius:6px;width:100%;font-weight:bold} .hidden{display:none}</style>
</head><body>
<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="msg"></p>
<p style="font-size:12px;color:#888">Demo: admin / prophet123</p>
</div>

<div class="box hidden" id="dashBox">
<h2>Welcome Pastor! 🙏</h2>
<p>Add New Sermon / Event</p>
<input id="title" placeholder="Title e.g Sunday Service">
<textarea id="desc" placeholder="Description"></textarea>
<button onclick="save()">SAVE SERMON</button>
<button onclick="logout()" style="background:#333;margin-top:10px">LOGOUT</button>
<h3>Saved Items:</h3>
<div id="list"></div>
</div>

<script>
function login(){
 if(document.getElementById('u').value==='admin' && document.getElementById('p').value==='prophet123'){
   document.getElementById('loginBox').classList.add('hidden');
   document.getElementById('dashBox').classList.remove('hidden');
   show();
 } else { document.getElementById('msg').innerText='Wrong username or password!'; }
}
function save(){
 let t=document.getElementById('title').value;
 let d=document.getElementById('desc').value;
 if(!t) return alert('Enter title');
 let items=JSON.parse(localStorage.getItem('sermons')||'[]');
 items.push({t:t,d:d});
 localStorage.setItem('sermons',JSON.stringify(items));
 document.getElementById('title').value=''; document.getElementById('desc').value='';
 show(); alert('Saved!');
}
function show(){
 let items=JSON.parse(localStorage.getItem('sermons')||'[]');
 document.getElementById('list').innerHTML=items.map(i=>'<p><b>'+i.t+'</b><br>'+i.d+'</p><hr>').join('');
}
function logout(){ location.reload(); }
</script>
</body></html>
